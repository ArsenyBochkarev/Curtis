name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Job 1: build the library and the executable. lean-action with the test
  # step disabled; its elan and .lake caches keep the rebuild fast.
  #
  # The exe comes FIRST: the CLI smoke tests inside the test modules invoke
  # .lake/build/bin/curtis during their own elaboration, and lake gives no
  # ordering guarantee between library modules and the exe target (with a
  # cached .lake the binary may even be stale from an older commit).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          test: false
          build-args: curtis
      - name: Build everything else
        run: lake build

  # Job 2: the test runs. Every suite is its own command and its own step,
  # so a failure points at the suite directly (lake test with no arguments
  # would only print the usage help of our driver and exit 1).
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          test: false
      - name: Unit tests
        run: lake test -- Unit
      - name: E2E tests
        run: lake test -- E2E
